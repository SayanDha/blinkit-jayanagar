<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkit Delivery Panel (Batched Multi-Shop)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f6f9; }
        header { background: #ff9800; color: white; padding: 18px; font-size: 26px; font-weight: bold; text-align: center; }
        .container { width: 95%; max-width: 1300px; margin: 20px auto; }
        .card { background: white; padding: 18px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, .1); }
        .section-title { font-size: 22px; font-weight: bold; margin-bottom: 15px; }
        .order-card { background: #fafafa; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #ff9800; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; background: #2196f3; color: white; font-size: 13px; margin-top: 8px; }
        button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 10px; }
        .btn-green { background: #2e7d32; color: white; }
        .btn-blue { background: #1565c0; color: white; }
        .btn-orange { background: #ff9800; color: white; font-weight: bold; width: 100%; }
        select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 10px; }
        #toast { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 8px; color: white; z-index: 9999; }
        .success { background: #2e7d32; }
        .error { background: #c62828; }
        .login-card { max-width: 450px; margin: 60px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .profile-header-bar { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header>🚚 Delivery Dashboard Panel</header>

    <div id="loginSection" class="container">
        <div class="login-card" style="text-align: center;">
            <div class="section-title">Delivery Partner Login</div>
            <div class="form-group">
                <label for="username">Username / Agent ID</label>
                <input type="text" id="username" placeholder="Enter your registered username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-orange" id="loginBtn">Secure Log In</button>
        </div>
    </div>

    <div id="dashboardSection" class="container" style="display: none;">
        <div class="card profile-header-bar">
            <div>
                <span class="section-title" style="margin: 0;">Welcome, <span id="activeAgentName" style="color: #ff9800;">Partner</span></span>
            </div>
            <button class="btn-blue" id="logoutBtn" style="margin: 0; background: #c62828;">Log Out</button>
        </div>

        <div class="card">
            <div class="section-title">📦 Available Accepted Orders for Pickup (Post 2-Min Buffer)</div>
            <div id="availableOrders">Loading...</div>
        </div>

        <div class="card">
            <div class="section-title">🚚 My Active Deliveries</div>
            <div id="myOrders">Loading...</div>
        </div>

        <div class="card">
            <div class="section-title">📜 Delivery History</div>
            <div id="historyOrders">Loading...</div>
        </div>
    </div>

    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEgVRjqj5SshWvkUsM2pPbPs6dMP77wAw",
            authDomain: "jayanagar-delivery.firebaseapp.com",
            projectId: "jayanagar-delivery",
            storageBucket: "jayanagar-delivery.firebasestorage.app",
            messagingSenderId: "460592006643",
            appId: "1:460592006643:web:998daeb371e9e342043e86",
            measurementId: "G-7L7T72ENL1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let sessionDriverName = "";
        let knownAvailableOrders = new Set();
        let isInitialLoad = true;

        function showToast(message, type = "success") {
            const toast = document.getElementById("toast");
            toast.innerHTML = message;
            toast.className = type;
            toast.style.display = "block";
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => { toast.style.display = "none"; }, 3000);
        }

        function playDeliveryAlert() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {}
        }

        /* PERSISTENT LOGIN CHECK */
        function checkDeliverySession() {
            const savedSession = localStorage.getItem("deliverySession");
            if (savedSession) {
                sessionDriverName = savedSession;
                document.getElementById("activeAgentName").innerText = sessionDriverName;
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("dashboardSection").style.display = "block";
                loadAvailableOrders();
                loadMyOrders();
                loadHistory();
            }
        }

        document.getElementById("loginBtn").addEventListener("click", async () => {
            const userVal = document.getElementById("username").value.trim();
            const passVal = document.getElementById("passwordInput") ? document.getElementById("passwordInput").value.trim() : document.getElementById("password").value.trim();

            if (!userVal || !passVal) {
                showToast("Please enter both Username and Password.", "error");
                return;
            }

            try {
                let matchedAccount = null;
                const collectionsToScan = ["delivery_boys", "delivery_partners", "delivery"];
                const identifierFields = ["loginId", "username", "loginID"];
                const passwordFields = ["password", "pass"];

                for (const collName of collectionsToScan) {
                    for (const idField of identifierFields) {
                        for (const passField of passwordFields) {
                            try {
                                const authQuery = query(collection(db, collName), where(idField, "==", userVal), where(passField, "==", passVal));
                                const snapshot = await getDocs(authQuery);
                                if (!snapshot.empty) {
                                    matchedAccount = snapshot.docs[0].data();
                                    break;
                                }
                            } catch (e) {}
                        }
                        if (matchedAccount) break;
                    }
                    if (matchedAccount) break;
                }

                if (matchedAccount) {
                    sessionDriverName = matchedAccount.name || matchedAccount.Name || userVal;
                    localStorage.setItem("deliverySession", sessionDriverName);

                    document.getElementById("activeAgentName").innerText = sessionDriverName;
                    document.getElementById("loginSection").style.display = "none";
                    document.getElementById("dashboardSection").style.display = "block";
                    showToast("Logged in successfully!");

                    loadAvailableOrders();
                    loadMyOrders();
                    loadHistory();
                } else {
                    showToast("Invalid credentials. Access Denied.", "error");
                }
            } catch (error) { showToast("Database connectivity failure.", "error"); }
        });

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("deliverySession");
            location.reload();
        });

        /* =======================================================
           LOAD AVAILABLE ORDERS (WITH 2-MINUTE SHOP BUFFER CHECK)
        ======================================================= */
        function loadAvailableOrders() {
            if (!sessionDriverName) return;
            const list = document.getElementById("availableOrders");
            
            const q = query(collection(db, "orders"));

            onSnapshot(q, (snapshot) => {
                if (!sessionDriverName) return;
                list.innerHTML = "";
                let count = 0;
                let soundTriggered = false;

                const twoMinutesMs = 2 * 60 * 1000;
                const now = Date.now();

                snapshot.forEach(orderDoc => {
                    const order = orderDoc.data();
                    const id = orderDoc.id;

                    if (order.deliveryBoy || order.status === "delivered" || order.status === "cancelled") return;

                    // Compute Order Time & Buffer status
                    const orderTime = order.time ? (typeof order.time === 'number' ? order.time : new Date(order.time).getTime()) : now;
                    const timeElapsed = now - orderTime;

                    // Check if all shops have responded
                    const allShopsResponded = order.shopIds && order.shopIds.length > 0 && order.shopIds.every(sId => {
                        return order.shopStatuses && order.shopStatuses[sId] && order.shopStatuses[sId] !== 'placed' && order.shopStatuses[sId] !== 'pending';
                    });

                    // 2-MINUTE BUFFER RULE: Order goes to delivery panel ONLY AFTER 2 Minutes,
                    // or if all shops manually responded before 2 minutes.
                    const isBufferCleared = (timeElapsed >= twoMinutesMs) || allShopsResponded;

                    if (!isBufferCleared) return;

                    // Gather only shop items that were accepted
                    let acceptedItems = [];
                    if (order.shopStatuses) {
                        acceptedItems = (order.items || []).filter(item => order.shopStatuses[String(item.shopId)] === "accepted");
                    } else if (order.status === "accepted") {
                        acceptedItems = order.items || [];
                    }

                    // If all items were rejected, do not show in delivery panel
                    if (acceptedItems.length === 0) return;

                    if (!isInitialLoad && !knownAvailableOrders.has(id)) {
                        soundTriggered = true;
                    }
                    knownAvailableOrders.add(id);
                    count++;

                    let storeCost = 0;
                    acceptedItems.forEach(item => { storeCost += (Number(item.price) || 0) * (Number(item.qty) || 1); });
                    const deliveryCharge = Number(order.deliveryCharge) || 0;

                    const div = document.createElement("div");
                    div.className = "order-card";
                    div.innerHTML = `
                        <h3>Order #${order.orderId || id.slice(0,8)}</h3>
                        <span class="badge" style="background:#4caf50;">Ready for Pickup (Buffer Cleared)</span><br><br>
                        <b>Customer :</b> ${order.name || "N/A"}<br>
                        <b>Phone :</b> ${order.phone || "N/A"}<br>
                        <b>Address :</b> ${order.address || "N/A"}<br><br>
                        <b>Accepted Items to Pick Up :</b><br>
                        ${acceptedItems.map(i => `• ${i.name} × ${i.qty}`).join("<br>")}<br><br>
                        <b style="color: #c62828;">Total Cash To Collect: ₹${storeCost + deliveryCharge}</b><br><br>
                        <button class="btn-green" id="accept-${id}">Accept Delivery Run</button>
                    `;
                    list.appendChild(div);

                    setTimeout(() => {
                        const btn = document.getElementById(`accept-${id}`);
                        if (btn) {
                            btn.onclick = async () => {
                                try {
                                    await updateDoc(doc(db, "orders", id), {
                                        status: "delivery_accepted",
                                        deliveryBoy: sessionDriverName
                                    });
                                    showToast("Delivery run assigned to you!");
                                } catch (e) { showToast("Assignment failed", "error"); }
                            };
                        }
                    }, 0);
                });

                if (soundTriggered) playDeliveryAlert();
                isInitialLoad = false;

                if (count === 0) list.innerHTML = "<p>No Orders Ready For Pickup Right Now</p>";
            });
        }

        // Periodically refresh available orders to move orders into delivery after 2-min timer expires
        setInterval(loadAvailableOrders, 5000);

        function loadMyOrders() {
            if (!sessionDriverName) return;
            const list = document.getElementById("myOrders");

            const q = query(collection(db, "orders"), where("deliveryBoy", "==", sessionDriverName));

            onSnapshot(q, (snapshot) => {
                list.innerHTML = "";
                if (snapshot.empty) {
                    list.innerHTML = "<p>No Active Deliveries</p>";
                    return;
                }

                snapshot.forEach(orderDoc => {
                    const order = orderDoc.data();
                    const id = orderDoc.id;
                    if (order.status === "delivered" || order.status === "cancelled") return;

                    const div = document.createElement("div");
                    div.className = "order-card";
                    div.innerHTML = `
                        <h3>Order #${order.orderId || id.slice(0,8)}</h3>
                        <b>Customer :</b> ${order.name}<br>
                        <b>Phone :</b> ${order.phone}<br>
                        <b>Address :</b> ${order.address}<br><br>
                        <select id="status-${id}">
                            <option value="delivery_accepted" ${order.status === 'delivery_accepted' ? 'selected':''}>Accepted</option>
                            <option value="picked_up" ${order.status === 'picked_up' ? 'selected':''}>Picked Up</option>
                            <option value="out_for_delivery" ${order.status === 'out_for_delivery' ? 'selected':''}>Out For Delivery</option>
                            <option value="delivered" ${order.status === 'delivered' ? 'selected':''}>Delivered</option>
                        </select>
                        <button class="btn-blue" id="update-${id}">Update Status</button>
                    `;
                    list.appendChild(div);

                    setTimeout(() => {
                        const btn = document.getElementById(`update-${id}`);
                        if (btn) {
                            btn.onclick = async () => {
                                const newStatus = document.getElementById(`status-${id}`).value;
                                await updateDoc(doc(db, "orders", id), { status: newStatus });
                                showToast("Status updated successfully!");
                            };
                        }
                    }, 0);
                });
            });
        }

        function loadHistory() {
            if (!sessionDriverName) return;
            const list = document.getElementById("historyOrders");
            const q = query(collection(db, "orders"), where("deliveryBoy", "==", sessionDriverName));

            onSnapshot(q, (snapshot) => {
                list.innerHTML = "";
                snapshot.forEach(orderDoc => {
                    const order = orderDoc.data();
                    if (order.status !== "delivered") return;
                    const div = document.createElement("div");
                    div.className = "order-card";
                    div.innerHTML = `
                        <h3>Order #${order.orderId || orderDoc.id.slice(0,8)}</h3>
                        👤 ${order.name}<br>
                        <span class="badge">Delivered</span>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // Initialize persistent login check
        checkDeliverySession();
    </script>
</body>
</html>
